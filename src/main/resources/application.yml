spring:
  application:
    name: experian-orquestador

  jpa:
      hibernate:
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
          implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
        ddl-auto: validate

server:
  port: 6000

app:
  kafka:
    topics:
      webhook-events: experian.webhook.events
      descarga-orden: documento.descarga.orden
      descarga-resultado: documento.descarga.resultado
      custodia-orden: documento.custodia.orden
      custodia-resultado: documento.custodia.resultado